repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: private-files
        name: Keep private files out of the repository
        language: fail
        entry: Store credentials and runtime data outside Git. Use an empty .env.example.
        files: '(^|/)(\.env($|\.(?!example$))|[^/]*\.(pem|key|p12|pfx|db|sqlite|sqlite3)(-.*)?$|id_(rsa|ed25519)$)|^(data|uploads|backups|secrets|\.ssh|\.aws|\.kube)/'
        types: []
