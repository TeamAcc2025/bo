interface:
  display_name: "Wayfinder"
  short_description: "Map a large effort as decision tickets"
  default_prompt: "Use $wayfinder to chart a shared decision map for this large uncertain effort, asking one question at a time to clarify the destination and frontier."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
  - type: mcp
    value: codex_apps
    description: BO native GBrain recall before planning. GitHub read/write capability for authorized decision maps and tickets.
